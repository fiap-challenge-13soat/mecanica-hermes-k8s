name: New Relic - Deploy

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy New Relic Monitoring"
    runs-on: ubuntu-latest
    environment: aws

    defaults:
      run:
        working-directory: ./k8s
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: aws eks update-kubeconfig --name mechermes-eks

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Helm Repositories
        run: |
          helm repo add newrelic https://helm-charts.newrelic.com
          helm repo update

      - name: Cleanup old Helm releases
        run: |
          echo "Cleaning up old Helm release secrets (keeping last 3)..."
          # Get all Helm release secrets sorted by creation time, skip the 3 most recent
          OLD_SECRETS=$(kubectl get secrets -n newrelic \
            -l owner=helm,name=newrelic-bundle \
            --sort-by=.metadata.creationTimestamp \
            -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' | head -n -3)
          
          if [ -n "$OLD_SECRETS" ]; then
            echo "$OLD_SECRETS" | xargs -r kubectl delete secret -n newrelic --ignore-not-found=true
            echo "Deleted old release secrets"
          else
            echo "No old secrets to clean up"
          fi
        continue-on-error: true

      - name: Remove conflicting webhook configurations
        run: |
          echo "Removing conflicting webhook configurations..."
          kubectl delete mutatingwebhookconfiguration newrelic-bundle-nri-metadata-injection --ignore-not-found=true
          kubectl delete validatingwebhookconfiguration --all --ignore-not-found=true
          sleep 3
          echo "Webhook cleanup complete"
        continue-on-error: true

      - name: Install/upgrade nri-bundle
        run: |
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic \
            --create-namespace \
            --values ./base/newrelic/helm-values.yaml \
            --set global.licenseKey=${{ secrets.NEW_RELIC_LICENSE_KEY }}
    
      - name: Patch kubelet DaemonSet for hostNetwork
        run: |
          echo "Applying hostNetwork patch to kubelet DaemonSet..."
          kubectl patch daemonset newrelic-bundle-nrk8s-kubelet -n newrelic --type='json' -p='[
            {
              "op": "add",
              "path": "/spec/template/spec/hostNetwork",
              "value": true
            },
            {
              "op": "replace",
              "path": "/spec/template/spec/dnsPolicy",
              "value": "ClusterFirstWithHostNet"
            }
          ]'
          echo "Patch applied successfully"
          
          echo "Waiting for pods to restart (timeout: 5 minutes)..."
          kubectl rollout status daemonset/newrelic-bundle-nrk8s-kubelet -n newrelic --timeout=300s || true
          
          echo "Verifying pod status..."
          kubectl get pods -n newrelic -l app.kubernetes.io/component=kubelet
          
          echo "Checking for errors in pod events..."
          kubectl get events -n newrelic --field-selector involvedObject.kind=Pod --sort-by='.lastTimestamp' | tail -20
          
          echo "Deployment completed. Note: kubelet pods may take additional time to stabilize."
    
      - name: Create New Relic license secret in HML namespace
        run: |
          kubectl create secret generic newrelic-license-secret \
            --from-literal=license-key=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            --from-literal=otlp-header="api-key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --namespace mecanica-hermes-hml \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create New Relic license secret in PRD namespace
        run: |
          kubectl create secret generic newrelic-license-secret \
            --from-literal=license-key=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            --from-literal=otlp-header="api-key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --namespace mecanica-hermes-prd \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Deployment Summary
        run: |
          echo "## New Relic Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ New Relic infrastructure deployed to cluster" >> $GITHUB_STEP_SUMMARY
          echo "✅ Monitoring both HML and PRD namespaces" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Filter by namespace in New Relic:" >> $GITHUB_STEP_SUMMARY
          echo "- HML: \`namespaceName='mecanica-hermes-hml'\`" >> $GITHUB_STEP_SUMMARY
          echo "- PRD: \`namespaceName='mecanica-hermes-prd'\`" >> $GITHUB_STEP_SUMMARY
