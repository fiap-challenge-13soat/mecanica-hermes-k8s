name: Recreate - API Service (Force NLB Update)

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "prd"
        type: choice
        options:
          - hml
          - prd

permissions:
  contents: read

jobs:
  recreate:
    name: "Recreate API Service"
    runs-on: ubuntu-latest
    environment: aws

    defaults:
      run:
        working-directory: ./k8s
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: aws eks update-kubeconfig --name mechermes-eks

      - name: Delete existing service
        run: |
          echo "Deleting existing mecanica-hermes-api service..."
          kubectl delete service mecanica-hermes-api -n mecanica-hermes-${{ inputs.environment }} --ignore-not-found=true
          
          echo "Waiting for load balancer deletion..."
          sleep 30
          
          echo "✓ Service deleted"

      - name: Recreate service with internal NLB annotations
        run: |
          echo "Recreating service with internal NLB annotations..."
          kubectl apply -f ./base/mechermes-api/service.yaml -n mecanica-hermes-${{ inputs.environment }}
          
          echo "✓ Service recreated"

      - name: Wait for NLB provisioning
        run: |
          echo "Waiting for internal NLB to be provisioned (this may take 2-5 minutes)..."
          
          for i in {1..20}; do
            echo "Checking service status (attempt $i/20)..."
            
            EXTERNAL_IP=$(kubectl get service mecanica-hermes-api -n mecanica-hermes-${{ inputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || echo "")
            
            if [ -n "$EXTERNAL_IP" ]; then
              echo "✓ Internal NLB provisioned!"
              echo "✓ NLB DNS: $EXTERNAL_IP"
              break
            fi
            
            echo "Still provisioning... waiting 15 seconds"
            sleep 15
          done

      - name: Verify NLB is internal
        run: |
          echo "Verifying NLB scheme is internal..."
          
          NLB_ARN=$(aws elbv2 describe-load-balancers \
            --query "LoadBalancers[?VpcId=='vpc-08f5f99bba9c57fae' && Type=='network' && Scheme=='internal'] | [0].LoadBalancerArn" \
            --output text)
          
          if [ "$NLB_ARN" = "None" ] || [ -z "$NLB_ARN" ]; then
            echo "❌ ERROR: No internal NLB found!"
            echo "Please check AWS Console to verify the NLB was created with internal scheme"
            exit 1
          fi
          
          echo "✓ Internal NLB verified!"
          echo "✓ NLB ARN: $NLB_ARN"
          
          NLB_LISTENER_ARN=$(aws elbv2 describe-listeners \
            --load-balancer-arn "$NLB_ARN" \
            --query "Listeners[?Port==\`80\`] | [0].ListenerArn" \
            --output text)
          
          echo "✓ NLB Listener ARN: $NLB_LISTENER_ARN"

      - name: Summary
        run: |
          echo "## Service Recreate Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Old internet-facing NLB deleted" >> $GITHUB_STEP_SUMMARY
          echo "✅ Service recreated with internal NLB annotations" >> $GITHUB_STEP_SUMMARY
          echo "✅ New internal NLB provisioned and verified" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Next step:** Run \`API Gateway ${{ inputs.environment == 'prd' && 'PRD' || 'HML' }} - Terraform Create\` workflow" >> $GITHUB_STEP_SUMMARY
