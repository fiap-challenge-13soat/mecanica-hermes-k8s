name: API - Destroy

on:
  workflow_dispatch:
    inputs:
      service:
        description: "Target service"
        required: true
        default: "api-cadastros"
        type: choice
        options:
          - api-cadastros
          - api-ordem-servico
          - api-pagamentos
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd

permissions:
  contents: read

jobs:
  deploy:
    name: "Destroy - Kubernetes Cluster"
    runs-on: ubuntu-latest
    environment: aws
    env:
      ENVIRONMENT: ${{ inputs.environment || vars.environment }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      - name: Configure Kubeconfig
        run: aws eks update-kubeconfig --name mechermes-eks

      - name: Destroy Kubernetes Applications
        working-directory: src/${{ inputs.service }}/overlays/${{ inputs.environment }}
        run: kubectl delete -k . --timeout=60s --wait=false
        continue-on-error: true
