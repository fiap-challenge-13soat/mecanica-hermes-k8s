name: Deploy - Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy - Kubernetes Cluster"
    runs-on: ubuntu-latest
    environment: aws
    env:
      ENVIRONMENT: ${{ inputs.environment || vars.environment }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        working-directory: ./k8s
        shell: bash

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6

      # Configure AWS Credentials for AWS CLI and other AWS SDKs and tools
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      # Install Kubectl
      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      # Configure Kubeconfig to connect to EKS Cluster
      - name: Configure Kubeconfig
        run: aws eks update-kubeconfig --name mechermes-eks

      # Create Namespace in the selected environment
      - name: Create Namespace
        run: kubectl apply -f ./overlays/${{ inputs.environment }}/namespace.yaml

      # Create Secrets to deploy applications
      - name: Create Secrets
        run: |
          DB_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier mechermes-${{ inputs.environment }}-rds --query "DBInstances[0].Endpoint.Address" --output text)
          DB_ARN=$(aws rds describe-db-instances --db-instance-identifier mechermes-${{ inputs.environment }}-rds --query "DBInstances[0].MasterUserSecret.SecretArn" --output text)
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$DB_ARN" --query SecretString --output text | jq -r '.password')
          kubectl create secret generic app-secret --from-literal=ConnectionStrings__DefaultConnection="Host=$DB_ENDPOINT;Database=mechermesdb;Username=postgres;Password=$DB_PASSWORD;Pooling=true" --from-literal=Jwt__Key="${{ secrets.JWT_KEY }}" --from-literal=EmailSenderOptions__Password="${{ secrets.EMAIL_PASSWORD }}" -n mecanica-hermes-${{ inputs.environment }} --dry-run=client -o yaml | kubectl apply -f -

      # Deploy Applications in the selected environment
      - name: Deploy to Kubernetes
        run: kubectl apply -k ./overlays/${{ inputs.environment }}

      # Disponibilizar o Endpoint da Aplicação
      - name: Get Application Endpoint
        run: |
          SERVICE_DNS=""
          while [ -z $SERVICE_DNS ]; do
            echo "Waiting for LoadBalancer IP..."
            SERVICE_DNS=$(kubectl get svc mecanica-hermes-api-service -n mecanica-hermes-${{ inputs.environment }} --template="{{range .status.loadBalancer.ingress}}{{.ip}}{{end}}")
            [ -z "$SERVICE_DNS" ] && sleep 10
          done
          echo "Application is available at http://$SERVICE_DNS"
