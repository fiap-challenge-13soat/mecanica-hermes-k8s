name: Deploy - Kubernetes Cluster

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy - Kubernetes Cluster"
    runs-on: ubuntu-latest
    environment: aws
    env:
      ENVIRONMENT: ${{ inputs.environment || vars.environment }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        working-directory: ./k8s
        shell: bash

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6

      # Configure AWS Credentials for AWS CLI and other AWS SDKs and tools
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      # Install Kubectl
      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      # Configure Kubeconfig to connect to EKS Cluster
      - name: Configure Kubeconfig
        run: aws eks update-kubeconfig --name mechermes-eks

      # Create Namespace in the selected environment
      - name: Create Namespace
        run: kubectl apply -f ./overlays/${{ inputs.environment }}/namespace.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add New Relic Helm repo
        run: helm repo add newrelic https://helm-charts.newrelic.com && helm repo update
    
      # Fetch RDS credentials early — reused by Helm (nri-postgresql) and app-secret
      - name: Fetch RDS credentials
        run: |
          DB_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier mechermes-${{ inputs.environment }}-rds --query "DBInstances[0].Endpoint.Address" --output text)
          DB_ARN=$(aws rds describe-db-instances --db-instance-identifier mechermes-${{ inputs.environment }}-rds --query "DBInstances[0].MasterUserSecret.SecretArn" --output text)
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$DB_ARN" --query SecretString --output text | jq -r '.password')
          echo "DB_ENDPOINT=$DB_ENDPOINT" >> "$GITHUB_ENV"
          echo "DB_PASSWORD=$DB_PASSWORD" >> "$GITHUB_ENV"

      # Create read-only monitoring user for New Relic nri-postgresql integration
      - name: Create New Relic monitoring DB user
        run: |
          cat <<EOF | kubectl apply -f -
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: newrelic-db-setup
            namespace: mecanica-hermes-${{ inputs.environment }}
          data:
            setup.sql: |
              DO \$\$
              BEGIN
                IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'newrelic_monitor') THEN
                  CREATE ROLE newrelic_monitor WITH LOGIN PASSWORD '$DB_PASSWORD' NOSUPERUSER NOCREATEDB NOCREATEROLE;
                END IF;
              END
              \$\$;
              GRANT CONNECT ON DATABASE mechermesdb TO newrelic_monitor;
              GRANT USAGE ON SCHEMA public TO newrelic_monitor;
              GRANT SELECT ON ALL TABLES IN SCHEMA public TO newrelic_monitor;
              ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT SELECT ON TABLES TO newrelic_monitor;
              GRANT pg_monitor TO newrelic_monitor;
          EOF
          
          # Run SQL script
          kubectl run psql-newrelic-setup --restart=Never \
            --namespace mecanica-hermes-${{ inputs.environment }} \
            --image=postgres:17-alpine \
            --env="PGPASSWORD=$DB_PASSWORD" \
            --overrides="{
              \"spec\": {
                \"containers\": [{
                  \"name\": \"psql-newrelic-setup\",
                  \"image\": \"postgres:17-alpine\",
                  \"command\": [\"psql\", \"-h\", \"$DB_ENDPOINT\", \"-U\", \"postgres\", \"-d\", \"mechermesdb\", \"-f\", \"/config/setup.sql\"],
                  \"env\": [{\"name\": \"PGPASSWORD\", \"value\": \"$DB_PASSWORD\"}],
                  \"volumeMounts\": [{\"name\": \"config\", \"mountPath\": \"/config\"}]
                }],
                \"volumes\": [{
                  \"name\": \"config\",
                  \"configMap\": {\"name\": \"newrelic-db-setup\"}
                }],
                \"restartPolicy\": \"Never\"
              }
            }"
          
          # Wait for pod to complete
          kubectl wait --for=condition=complete --timeout=60s pod/psql-newrelic-setup -n mecanica-hermes-${{ inputs.environment }} || true
          # Clean up
          kubectl delete pod psql-newrelic-setup -n mecanica-hermes-${{ inputs.environment }} --ignore-not-found=true
          kubectl delete configmap newrelic-db-setup -n mecanica-hermes-${{ inputs.environment }} --ignore-not-found=true
        continue-on-error: true

      - name: Cleanup conflicting webhook resources
        run: |
          kubectl delete mutatingwebhookconfiguration newrelic-bundle-nri-metadata-injection --ignore-not-found=true
          kubectl delete deployment newrelic-bundle-nri-kube-events -n newrelic --ignore-not-found=true
          sleep 5
        continue-on-error: true
    
      - name: Install/upgrade nri-bundle
        run: |
          helm upgrade --install newrelic-bundle newrelic/nri-bundle \
            --namespace newrelic \
            --create-namespace \
            --values ./base/newrelic/helm-values.yaml \
            --set global.licenseKey=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            --set 'newrelic-infrastructure.integrations.nri-postgresql-config.integrations[0].env.HOSTNAME'="$DB_ENDPOINT" \
            --set 'newrelic-infrastructure.integrations.nri-postgresql-config.integrations[0].env.USERNAME'=newrelic_monitor \
            --set 'newrelic-infrastructure.integrations.nri-postgresql-config.integrations[0].env.PASSWORD'="$DB_PASSWORD"
    
      - name: Create New Relic license secret in app namespace
        run: |
          kubectl create secret generic newrelic-license-secret \
            --from-literal=license-key=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            --from-literal=otlp-header="api-key=${{ secrets.NEW_RELIC_LICENSE_KEY }}" \
            --namespace mecanica-hermes-${{ inputs.environment }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Create Secrets to deploy applications
      - name: Create Secrets
        run: |
          kubectl create secret generic app-secret \
            --from-literal=ConnectionStrings__DefaultConnection="Host=$DB_ENDPOINT;Database=mechermesdb;Username=postgres;Password=$DB_PASSWORD;Pooling=true" \
            --from-literal=Jwt__Key="${{ secrets.JWT_KEY }}" \
            --from-literal=EmailSender__Password="${{ secrets.EMAIL_PASSWORD }}" \
            --from-literal=MediatR__LicenseKey="${{ secrets.MEDIATR_LICENSE_KEY }}" \
            --from-literal=AutoMapper__LicenseKey="${{ secrets.AUTOMAPPER_LICENSE_KEY }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            -n mecanica-hermes-${{ inputs.environment }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Atualiza a tag da imagem no overlay antes do deploy
      - name: Update image tag
        run: |
          cd ./overlays/${{ inputs.environment }}
          kustomize edit set image mechermes/mecanica-hermes-api=mechermes/mecanica-hermes-api:${{ inputs.image_tag || 'main' }}

      # Deploy Applications in the selected environment
      - name: Deploy to Kubernetes
        run: kubectl apply -k ./overlays/${{ inputs.environment }}

      # Disponibilizar o Endpoint da Aplicação
      - name: Get Application Endpoint
        run: |
          attempts=0
          max_attempts=10
          while true; do
            external_ip=$(kubectl get svc mecanica-hermes-api -n mecanica-hermes-${{ inputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$external_ip" ] && [ "$external_ip" != "<pending>" ]; then
              echo "External IP disponível: $external_ip"
              break
            fi
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "External IP não ficou disponível após $max_attempts tentativas."
              kubectl get svc -n mecanica-hermes-${{ inputs.environment }}
            fi
            echo "External IP ainda não disponível. Tentativa $attempts/$max_attempts. Aguardando 3s..."
            sleep 3
          done
          kubectl get svc -n mecanica-hermes-${{ inputs.environment }}
