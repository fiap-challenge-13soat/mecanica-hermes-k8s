name: API - Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: "hml"
        type: choice
        options:
          - hml
          - prd
      image_tag:
        description: "Docker image tag to deploy"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

jobs:
  deploy:
    name: "Deploy - Kubernetes Cluster"
    runs-on: ubuntu-latest
    environment: aws
    env:
      ENVIRONMENT: ${{ inputs.environment || vars.environment }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        working-directory: ./k8s
        shell: bash

    steps:
      # Checkout the repository to the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v6

      # Configure AWS Credentials for AWS CLI and other AWS SDKs and tools
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_DEFAULT_REGION }}

      # Install Kubectl
      - name: Install Kubectl
        uses: azure/setup-kubectl@v4

      # Configure Kubeconfig to connect to EKS Cluster
      - name: Configure Kubeconfig
        run: aws eks update-kubeconfig --name mechermes-eks

      # Create Namespace in the selected environment
      - name: Create Namespace
        run: kubectl apply -f ./overlays/${{ inputs.environment }}/namespace.yaml

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Add Helm repos
        run: |
          helm repo add metrics-server https://kubernetes-sigs.github.io/metrics-server/
          helm repo update

      - name: Install/upgrade metrics-server
        run: |
          helm upgrade --install metrics-server metrics-server/metrics-server \
            --namespace kube-system \
            --set args[0]="--kubelet-insecure-tls"
        continue-on-error: true

      # Extract Cognito User Pool ID using AWS CLI
      - name: Get Cognito Configuration
        id: cognito
        run: |
          USER_POOL_ID=$(aws cognito-idp list-user-pools --max-results 60 \
            --query "UserPools[?Name=='mechermes-${{ inputs.environment }}-userpool'].Id | [0]" \
            --output text)
          echo "user_pool_id=$USER_POOL_ID" >> $GITHUB_OUTPUT
          echo "authority=https://cognito-idp.us-east-1.amazonaws.com/$USER_POOL_ID" >> $GITHUB_OUTPUT

      # Create Secrets to deploy applications
      - name: Create Secrets
        run: |
          DB_ENDPOINT=$(aws rds describe-db-instances --db-instance-identifier mechermes-${{ inputs.environment }}-rds --query "DBInstances[0].Endpoint.Address" --output text)
          DB_ARN=$(aws rds describe-db-instances --db-instance-identifier mechermes-${{ inputs.environment }}-rds --query "DBInstances[0].MasterUserSecret.SecretArn" --output text)
          DB_PASSWORD=$(aws secretsmanager get-secret-value --secret-id "$DB_ARN" --query SecretString --output text | jq -r '.password')
          kubectl create secret generic app-secret \
            --from-literal=ConnectionStrings__DefaultConnection="Host=$DB_ENDPOINT;Database=mechermesdb;Username=postgres;Password=$DB_PASSWORD;Pooling=true" \
            --from-literal=Jwt__Key="${{ secrets.JWT_KEY }}" \
            --from-literal=EmailSender__Password="${{ secrets.EMAIL_PASSWORD }}" \
            --from-literal=MediatR__LicenseKey="${{ secrets.MEDIATR_LICENSE_KEY }}" \
            --from-literal=AutoMapper__LicenseKey="${{ secrets.AUTOMAPPER_LICENSE_KEY }}" \
            --from-literal=NEW_RELIC_LICENSE_KEY=${{ secrets.NEW_RELIC_LICENSE_KEY }} \
            --from-literal=AUTH__AUTHORITY="${{ steps.cognito.outputs.authority }}" \
            --from-literal=AUTH__ISSUER="${{ steps.cognito.outputs.authority }}" \
            -n mecanica-hermes-${{ inputs.environment }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Atualiza a tag da imagem no overlay antes do deploy
      - name: Update image tag
        run: |
          cd ./overlays/${{ inputs.environment }}
          kustomize edit set image mechermes/mecanica-hermes-api=mechermes/mecanica-hermes-api:${{ inputs.image_tag || 'main' }}

      # Deploy Applications in the selected environment
      - name: Deploy to Kubernetes
        run: kubectl apply -k ./overlays/${{ inputs.environment }}

      # Disponibilizar o Endpoint da Aplicação
      - name: Get Application Endpoint
        run: |
          attempts=0
          max_attempts=10
          while true; do
            external_ip=$(kubectl get svc mecanica-hermes-api -n mecanica-hermes-${{ inputs.environment }} -o jsonpath='{.status.loadBalancer.ingress[0].hostname}' 2>/dev/null || true)
            if [ -n "$external_ip" ] && [ "$external_ip" != "<pending>" ]; then
              echo "External IP disponível: $external_ip"
              break
            fi
            attempts=$((attempts + 1))
            if [ "$attempts" -ge "$max_attempts" ]; then
              echo "External IP não ficou disponível após $max_attempts tentativas."
              kubectl get svc -n mecanica-hermes-${{ inputs.environment }}
            fi
            echo "External IP ainda não disponível. Tentativa $attempts/$max_attempts. Aguardando 3s..."
            sleep 3
          done
          kubectl get svc -n mecanica-hermes-${{ inputs.environment }}
