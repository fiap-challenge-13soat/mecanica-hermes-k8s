apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: mecanica-hermes-api-cadastros-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: mecanica-hermes-api-cadastros
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 80
