apiVersion: v1
kind: Service
metadata:
  name: mecanica-hermes-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
spec:
  selector:
    app: mecanica-hermes-api
  ports:
    - name: http
      port: 80
      targetPort: 8080
  type: LoadBalancer
